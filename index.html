<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f5f6f3">
<title>数独 · 静心一刻</title>
<link rel="stylesheet" href="sudoku.css?v=4">
</head>
<body>
<div class="shell">
<header class="top"><div class="brand"><div class="mark">▦</div><div><h1>数独</h1><small>静心一刻 · DAILY PUZZLE</small></div></div><div class="top-right"><span class="top-note">一格一数，慢慢来就好</span><div class="user-area"><button class="login-btn" id="login-btn">登录 / 注册</button><button class="user-chip" id="user-chip" style="display:none"><span class="avatar" id="avatar"></span><span class="uname" id="uname"></span><span class="ucaret">▾</span></button><div class="user-menu" id="user-menu" style="display:none"><div class="um-head"><strong id="um-nick"></strong><span id="um-username"></span></div><div class="um-exp"><span>Lv.<b id="um-level">1</b></span><span id="um-exp-text">0/100</span></div><button class="um-btn" id="logout-btn">退出登录</button></div></div><button class="theme-btn" id="theme" aria-label="切换深浅色主题">🌙</button></div></header>
<main>
<section class="board-wrap">
  <div class="heading"><div><div class="eyebrow">SUDOKU · <span id="level-top">01</span> / 100</div><h2 id="title">晨间练习</h2></div><span class="level-label" id="difficulty">入门</span></div>
  <div class="board" id="board" role="grid" aria-label="数独棋盘"></div>
  <h3 class="num-head">选择数字</h3>
  <div class="numbers" id="numbers"></div>
  <p class="number-hint">也可以使用键盘输入数字，方向键移动格子。</p>
  <div class="controls"><button class="control" id="undo">↶ 撤销</button><button class="control" id="notes">✎ 笔记</button><button class="control" id="erase">⌫ 擦除</button><button class="control" id="hint">✦ 提示</button></div>
  <div class="message" id="message"></div>
</section>
<aside class="side">
  <h3>你的进度</h3>
  <p class="side-intro">一点点练习，也是在前进。</p>
  <div class="level-card" id="level-card" style="display:none">
    <div class="lc-top"><span class="lc-badge">Lv.<b id="lv-num">1</b></span><span class="lc-title" id="lv-title">晨间新手</span></div>
    <div class="lc-bar"><i id="lv-bar" style="width:0"></i></div>
    <div class="lc-meta"><span id="lv-exp">0 / 100</span></div>
  </div>
  <div class="opt-row" style="margin-top:0"><label for="challenge">挑战模式（不提示对错）</label><span class="switch"><input type="checkbox" id="challenge"><i></i></span></div>
  <div class="stats"><div class="stat"><span>已完成</span><strong><b id="completed">0</b><small style="font-size:12px;color:var(--muted);font-weight:400"> / 100</small></strong></div><div class="stat"><span>当前用时</span><strong id="timer">00:00</strong></div></div>
  <div class="best" id="best"></div>
  <div class="progress-head"><span>闯关进度</span><span id="progress-text">0 / 100</span></div>
  <div class="progress"><i id="progress-bar" style="width:0"></i></div>
  <div class="ach-head" id="ach-head" style="display:none"><h3>勋章</h3><span id="ach-count">0 / 0</span></div>
  <div class="ach-wall" id="ach-wall" style="display:none"></div>
  <div class="divider"></div>
  <div class="level-head"><h3>全部关卡</h3><button id="continue">继续当前关 ›</button></div>
  <div class="levels" id="levels"></div>
  <div class="foot" id="foot">你的进度仅保存在此设备的浏览器中。</div>
</aside>
</main>
</div>
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="trophy">🏆</div>
    <h3>恭喜完成本关！</h3>
    <p class="sub" id="modal-record" style="display:none">🎉 新纪录！</p>
    <div class="modal-stats">
      <div><span>本关用时</span><strong id="modal-time">00:00</strong></div>
      <div><span>最佳成绩</span><strong id="modal-best">--</strong></div>
    </div>
    <div class="modal-gain" id="modal-gain" style="display:none"></div>
    <div class="modal-actions">
      <button class="modal-btn ghost" id="modal-replay">重玩本关</button>
      <button class="modal-btn primary" id="modal-next">下一关 ›</button>
    </div>
  </div>
</div>
<!-- 登录/注册弹窗 -->
<div class="overlay" id="auth-overlay">
  <div class="modal auth-modal">
    <button class="auth-close" id="auth-close" aria-label="关闭">✕</button>
    <div class="auth-tabs">
      <button class="auth-tab active" id="tab-login" type="button">登录</button>
      <button class="auth-tab" id="tab-register" type="button">注册</button>
    </div>
    <form id="login-form">
      <input class="auth-input" id="login-username" placeholder="用户名" autocomplete="username">
      <input class="auth-input" id="login-password" type="password" placeholder="密码" autocomplete="current-password">
      <button class="auth-submit" type="submit">登 录</button>
      <p class="auth-msg" id="login-msg"></p>
    </form>
    <form id="register-form" style="display:none">
      <input class="auth-input" id="reg-username" placeholder="用户名（3-32位字母/数字/下划线）" autocomplete="username">
      <input class="auth-input" id="reg-password" type="password" placeholder="密码（至少6位）" autocomplete="new-password">
      <input class="auth-input" id="reg-nickname" placeholder="昵称（可选）" autocomplete="nickname">
      <button class="auth-submit" type="submit">注 册</button>
      <p class="auth-msg" id="reg-msg"></p>
    </form>
  </div>
</div>
<div class="toasts" id="toasts"></div>
<script src="sudoku-data.js?v=4"></script>
<script src="sudoku.js?v=4"></script>
</body>
</html>
